<style>
  :root{
    --bg-a:#0b0a14;
    --bg-b:#141026;
    --panel-a:#1a1730;
    --panel-b:#100e1c;
    --ink:#e9e6f7;
    --dim:#8a86ac;
    --gold:#ffd94a;
    --lilac:#b8a4ff;
    --edge:#a99fe0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100vh;}
  body{
    background:
      radial-gradient(circle at 20% -10%, rgba(184,164,255,.14), transparent 45%),
      radial-gradient(circle at 85% 10%, rgba(255,217,74,.08), transparent 40%),
      radial-gradient(circle at 50% 110%, rgba(0,0,0,.7), transparent 60%),
      linear-gradient(160deg, var(--bg-a), var(--bg-b));
    color:var(--ink);
    font-family:'Press Start 2P', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:26px 14px 60px;
    position:relative;
    overflow-x:hidden;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(2px 2px at 40px 60px, #ffffff33 50%, transparent 51%),
      radial-gradient(2px 2px at 180px 240px, #ffffff22 50%, transparent 51%),
      radial-gradient(1px 1px at 300px 120px, #ffffff33 50%, transparent 51%),
      radial-gradient(2px 2px at 400px 400px, #ffffff22 50%, transparent 51%),
      radial-gradient(1px 1px at 520px 80px, #ffffff2b 50%, transparent 51%),
      radial-gradient(2px 2px at 640px 300px, #ffffff22 50%, transparent 51%);
    background-repeat:repeat;
    background-size:680px 480px;
    pointer-events:none;
    z-index:0;
    opacity:.5;
  }

  .float-px{
    position:fixed; width:6px;height:6px;
    opacity:.4; z-index:0;
    animation:floaty 7s ease-in-out infinite;
    will-change:transform;
  }
  .float-px:nth-child(1){left:8%;top:20%;background:var(--gold);animation-duration:7s;}
  .float-px:nth-child(2){left:85%;top:15%;background:#7dd3fc;animation-duration:8.5s;animation-delay:-2s;}
  .float-px:nth-child(3){left:15%;top:75%;background:#ff7d7d;animation-duration:6.5s;animation-delay:-4s;}
  .float-px:nth-child(4){left:90%;top:70%;background:#9dff7d;animation-duration:9s;animation-delay:-1s;}
  .float-px:nth-child(5){left:50%;top:8%;background:var(--lilac);animation-duration:7.5s;animation-delay:-3s;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}
  @media (prefers-reduced-motion: reduce){.float-px{animation:none;} .heart-grid{animation:none !important;}}

  .wrap{position:relative;z-index:1;width:100%;max-width:540px;display:flex;flex-direction:column;align-items:center;gap:16px;}

  h1{
    font-size:17px;
    line-height:1.8;
    text-align:center;
    letter-spacing:1px;
    margin:8px 0 0;
    color:#fff;
    text-shadow:
      0 0 4px #fff,
      0 0 14px rgba(255,255,255,.8),
      0 0 30px rgba(184,164,255,.7),
      3px 3px 0 #000;
  }
  .subtitle{font-size:8px;color:var(--dim);text-align:center;line-height:1.9;}

  /* language switcher */
  .lang-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:2px;}
  .lang-btn{
    font-family:'Press Start 2P', monospace;
    font-size:7px;
    padding:6px 7px;
    background:#181626;
    border:2px solid #4d4870;
    color:var(--dim);
    cursor:pointer;
    transition:border-color .12s ease, color .12s ease, transform .12s ease;
  }
  .lang-btn:hover{transform:translateY(-1px); color:var(--ink); border-color:var(--edge);}
  .lang-btn.active{border-color:var(--gold); color:var(--gold); background:#2a2440;}

  /* panel with pixel-dust frame instead of a plain line */
  .pixel-panel{
    position:relative;
    background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
    padding:24px 18px;
    width:100%;
    clip-path: polygon(
      0 12px, 12px 12px, 12px 0,
      calc(100% - 12px) 0, calc(100% - 12px) 12px, 100% 12px,
      100% calc(100% - 12px), calc(100% - 12px) calc(100% - 12px), calc(100% - 12px) 100%,
      12px 100%, 12px calc(100% - 12px), 0 calc(100% - 12px)
    );
    box-shadow:0 24px 50px -24px rgba(0,0,0,.85);
    opacity:0;
    transform:translateY(10px);
  }
  .pixel-panel.in{transition:opacity .35s ease, transform .35s ease;opacity:1;transform:translateY(0);}
  .pixel-panel::before{
    content:"";
    position:absolute;
    inset:-11px;
    background-image:var(--dust-tile);
    background-repeat:repeat;
    background-size:24px 24px;
    z-index:-1;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.25));
  }

  .group-title{font-size:9px;color:var(--dim);margin-bottom:12px;letter-spacing:1px;}
  .option-row{display:flex;flex-direction:column;gap:8px;margin-bottom:22px;}
  .option-row:last-of-type{margin-bottom:0;}

  .pixel-btn{
    font-family:'Press Start 2P', monospace;
    background:#1c1a2c;
    color:var(--ink);
    border:2px solid var(--edge);
    box-shadow:4px 4px 0 0 #000;
    padding:12px 10px;
    font-size:9px;
    line-height:1.6;
    text-align:left;
    cursor:pointer;
    width:100%;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
  }
  .pixel-btn:hover{background:#2a2745;transform:translate(-2px,-2px);box-shadow:6px 6px 0 0 #000;}
  .pixel-btn:active{transform:translate(3px,3px);box-shadow:1px 1px 0 0 #000;}
  .pixel-btn.selected{background:#3a3566;border-color:var(--gold);box-shadow:4px 4px 0 0 var(--gold);}
  .pixel-btn small{display:block;color:var(--dim);font-size:7px;margin-top:6px;line-height:1.6;}

  .start-btn{
    position:relative;
    margin-top:8px;
    background:#241f42;
    border-color:var(--gold);
    color:var(--gold);
    text-align:center;
    font-size:11px;
    padding:16px 10px;
  }
  .start-btn::before{
    content:"";
    position:absolute; inset:-9px;
    background-image:var(--dust-tile);
    background-repeat:repeat;
    background-size:24px 24px;
    z-index:-1;
    opacity:.9;
  }
  .start-btn:hover:not(:disabled){background:#302a58;}
  .start-btn:disabled{opacity:.35;cursor:not-allowed;transform:none !important;}

  .progress-wrap{width:100%;display:flex;align-items:center;gap:10px;font-size:8px;color:var(--dim);}
  .progress-bar{flex:1;height:14px;background:#000;border:2px solid var(--edge);position:relative;overflow:hidden;}
  .progress-fill{height:100%;background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#e0b820 6px 12px);transition:width .3s ease;}

  .question-text{font-size:11px;line-height:2;margin-bottom:20px;min-height:66px;opacity:0;transform:translateY(6px);}
  .question-text.in{transition:opacity .25s ease, transform .25s ease;opacity:1;transform:translateY(0);}

  .answers{display:flex;flex-direction:column;gap:8px;}

  .heart-grid{
    display:grid;
    width:max-content;
    grid-template-columns:repeat(7, var(--px, 16px));
    grid-template-rows:repeat(6, var(--px, 16px));
    gap:0;
    margin:12px auto 8px;
    animation:heartbeat 1.4s ease-in-out infinite;
    will-change:transform;
  }
  @keyframes heartbeat{0%,100%{transform:scale(1);}30%{transform:scale(1.12);}45%{transform:scale(0.98);}60%{transform:scale(1.08);}}
  .heart-cell{width:var(--px,16px);height:var(--px,16px);}
  .heart-glow{filter: drop-shadow(0 0 4px #fff) drop-shadow(0 0 14px var(--glow, #fff));}

  .result-name{font-size:17px;text-align:center;margin:10px 0 4px;letter-spacing:1px;text-shadow:2px 2px 0 #000, 0 0 18px currentColor;}
  .result-caption{font-size:8px;color:var(--dim);text-align:center;line-height:2;margin-bottom:18px;}

  footer{margin-top:26px;font-size:7px;color:#57527a;text-align:center;line-height:2;z-index:1;position:relative;}

  .watermark{
    position:fixed;
    right:8px;
    bottom:6px;
    font-family:'Press Start 2P', monospace;
    font-size:6px;
    color:rgba(255,255,255,.14);
    letter-spacing:1px;
    pointer-events:none;
    z-index:5;
    user-select:none;
  }

  .hidden{display:none !important;}

  @media (max-width:380px){
    h1{font-size:13px;}
    .question-text{font-size:10px;}
    .heart-grid{--px:12px;}
  }
</style>
</head>

/* ================= pixel-dust border texture ================= */
(function(){
  const dots = [
    [1,1,'255,255,255',.9],[5,3,'255,217,74',1],[10,1,'125,211,252',.9],[15,4,'255,255,255',.5],
    [20,2,'193,125,255',1],[3,7,'255,217,74',.8],[8,8,'255,255,255',.6],[13,7,'125,211,252',1],
    [18,9,'255,217,74',.9],[22,7,'255,255,255',.4],[2,13,'193,125,255',.9],[6,14,'125,211,252',.8],
    [11,13,'255,217,74',1],[16,15,'255,255,255',.7],[21,14,'125,211,252',.6],[4,19,'255,217,74',.8],
    [9,20,'255,255,255',.5],[14,19,'193,125,255',1],[19,21,'255,217,74',.7],[0,22,'125,211,252',.9]
  ];
  let rects = dots.map(([x,y,c,o])=>`<rect x='${x}' y='${y}' width='2' height='2' fill='rgb(${c})' opacity='${o}'/>`).join('');
  const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='24' height='24' viewBox='0 0 24 24'>${rects}</svg>`;
  document.documentElement.style.setProperty('--dust-tile', `url("data:image/svg+xml,${encodeURIComponent(svg)}")`);
})();

/* ================= soul helpers ================= */
function getSoulSets(lang){
  const S = LANGS[lang];
  const classic = HUES_CLASSIC.map((hue,i)=>({name:S.namesClassic[i], hue}));
  const extended = HUES_EXT.map((hue,i)=>({name:S.namesExtended[i], hue, isWhite:i===HUES_EXT.length-1}));
  return [
    {key:"classic", label:S.classicLabel, hint:S.classicHint, data:classic},
    {key:"extended", label:S.extendedLabel, hint:S.extendedHint, data:extended}
  ];
}
function getAccuracyTiers(lang){
  const S = LANGS[lang];
  return [
    {key:"fast", label:S.accFastLabel, hint:S.accFastHint, perSoul:1},
    {key:"medium", label:S.accMediumLabel, hint:S.accMediumHint, perSoul:2},
    {key:"max", label:S.accMaxLabel, hint:S.accMaxHint, perSoul:3}
  ];
}
function soulColor(s){ return s.isWhite ? "#ffffff" : `hsl(${s.hue}, 72%, 58%)`; }

const HEART_MAP = ["0110110","1111111","1111111","0111110","0011100","0001000"];
function renderHeart(container, color, px){
  container.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "heart-grid heart-glow";
  grid.style.setProperty("--px", (px||16)+"px");
  grid.style.setProperty("--glow", color);
  HEART_MAP.forEach(row=>{
    [...row].forEach(bit=>{
      const cell = document.createElement("div");
      cell.className = "heart-cell";
      cell.style.background = bit==="1" ? color : "transparent";
      grid.appendChild(cell);
    });
  });
  container.appendChild(grid);
}

/* ================= screen transitions ================= */
function showScreen(id){
  const el = document.getElementById(id);
  el.classList.remove("hidden"); el.classList.remove("in");
  requestAnimationFrame(()=>requestAnimationFrame(()=>el.classList.add("in")));
}
function hideScreen(id){
  const el = document.getElementById(id);
  el.classList.add("hidden"); el.classList.remove("in");
}

/* ================= state ================= */
const browserLang = (navigator.language||"uk").slice(0,2);
let state = {
  lang: LANGS[browserLang] ? browserLang : "uk",
  soulSetKey:null, accuracyKey:null,
  questions:[], scores:[], current:0, winnerIndex:null,
  screen:"setup"
};

/* ================= progress persistence ================= */
const SAVE_KEY = "soulQuizProgress_v1";
function saveProgress(){
  try{
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      lang:state.lang, soulSetKey:state.soulSetKey, accuracyKey:state.accuracyKey,
      questions:state.questions, scores:state.scores, current:state.current,
      winnerIndex:state.winnerIndex, screen:state.screen
    }));
  }catch(e){}
}
function loadProgress(){
  try{ const raw = localStorage.getItem(SAVE_KEY); return raw ? JSON.parse(raw) : null; }
  catch(e){ return null; }
}
function clearProgress(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
}

const setChoicesEl = document.getElementById("setChoices");
const accChoicesEl = document.getElementById("accChoices");
const startBtn = document.getElementById("startBtn");
const langRow = document.getElementById("langRow");

Object.keys(LANGS).forEach(code=>{
  const b = document.createElement("button");
  b.className = "lang-btn";
  b.dataset.lang = code;
  b.textContent = LANGS[code].flag + " " + code.toUpperCase();
  b.addEventListener("click", ()=>applyLanguage(code));
  langRow.appendChild(b);
});

function buildSetChoices(){
  const sets = getSoulSets(state.lang);
  setChoicesEl.innerHTML = "";
  sets.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "pixel-btn" + (state.soulSetKey===opt.key ? " selected":"");
    btn.innerHTML = opt.label + "<small>"+opt.hint+"</small>";
    btn.addEventListener("click", ()=>{ state.soulSetKey = opt.key; buildSetChoices(); checkReady(); });
    setChoicesEl.appendChild(btn);
  });
}
function buildAccChoices(){
  const tiers = getAccuracyTiers(state.lang);
  accChoicesEl.innerHTML = "";
  tiers.forEach(opt=>{
    const btn = document.createElement("button");
    btn.className = "pixel-btn" + (state.accuracyKey===opt.key ? " selected":"");
    btn.innerHTML = opt.label + "<small>"+opt.hint+"</small>";
    btn.addEventListener("click", ()=>{ state.accuracyKey = opt.key; buildAccChoices(); checkReady(); });
    accChoicesEl.appendChild(btn);
  });
}
function checkReady(){ startBtn.disabled = !(state.soulSetKey && state.accuracyKey); }

function applyLanguage(lang){
  state.lang = lang;
  const S = LANGS[lang];
  document.documentElement.lang = lang;
  document.getElementById("mainTitle").textContent = S.title;
  document.getElementById("subtitleEl").textContent = S.subtitle;
  document.getElementById("step1Title").textContent = S.step1;
  document.getElementById("step2Title").textContent = S.step2;
  startBtn.textContent = S.startBtn;
  document.getElementById("restartBtn").textContent = S.restartBtn;
  document.getElementById("resultGroupTitle").textContent = S.resultTitle;
  document.getElementById("footerEl").innerHTML = S.footer;
  buildSetChoices();
  buildAccChoices();
  [...langRow.children].forEach(b=>b.classList.toggle("active", b.dataset.lang===lang));

  if(!document.getElementById("screenQuiz").classList.contains("hidden") && state.questions.length){
    renderQuestion(false);
  }
  if(!document.getElementById("screenResult").classList.contains("hidden") && state.winnerIndex!==null){
    renderResult();
  }
  document.getElementById("resumeTitleEl").textContent = S.resumeTitle;
  document.getElementById("resumeCaptionEl").textContent = S.resumeCaption;
  document.getElementById("resumeContinueBtn").textContent = S.resumeContinueBtn;
  document.getElementById("resumeRestartBtn").textContent = S.resumeRestartBtn;
}

document.getElementById("restartBtn").addEventListener("click", ()=>{
  clearProgress();
  state.questions = []; state.scores = []; state.current = 0; state.winnerIndex = null;
  state.soulSetKey = null; state.accuracyKey = null; state.screen = "setup";
  buildSetChoices(); buildAccChoices(); checkReady();
  hideScreen("screenResult");
  showScreen("screenSetup");
});

document.getElementById("resumeRestartBtn").addEventListener("click", ()=>{
  clearProgress();
  state.screen = "setup";
  hideScreen("screenResume");
  showScreen("screenSetup");
});

document.getElementById("resumeContinueBtn").addEventListener("click", ()=>{
  const saved = loadProgress();
  hideScreen("screenResume");
  if(!saved){ showScreen("screenSetup"); return; }
  applyLanguage(saved.lang);
  state.soulSetKey = saved.soulSetKey;
  state.accuracyKey = saved.accuracyKey;
  state.questions = saved.questions;
  state.scores = saved.scores;
  state.current = saved.current;
  state.winnerIndex = saved.winnerIndex;
  state.screen = saved.screen;
  buildSetChoices(); buildAccChoices(); checkReady();
  if(saved.screen === "result"){
    renderResult();
    showScreen("screenResult");
  } else {
    renderQuestion(false);
    showScreen("screenQuiz");
  }
});

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
  return arr;
}

function startQuiz(){
  const soulData = getSoulSets(state.lang).find(s=>s.key===state.soulSetKey).data;
  const tier = getAccuracyTiers(state.lang).find(t=>t.key===state.accuracyKey);
  let qs = [];
  soulData.forEach((soul, idx)=>{
    for(let k=0;k<tier.perSoul;k++){ qs.push({ templateIndex:k, soulIndex:idx }); }
  });
  qs = shuffle(qs);

  state.questions = qs;
  state.scores = soulData.map(()=>0);
  state.current = 0;
  state.winnerIndex = null;
  state.screen = "quiz";

  hideScreen("screenSetup");
  showScreen("screenQuiz");
  renderQuestion(true);
  saveProgress();
}
startBtn.addEventListener("click", startQuiz);

function renderQuestion(animate){
  const S = LANGS[state.lang];
  const soulData = getSoulSets(state.lang).find(s=>s.key===state.soulSetKey).data;
  const q = state.questions[state.current];
  const text = S.templates[q.templateIndex % S.templates.length].replace("{t}", soulData[q.soulIndex].name.toLowerCase());

  const qText = document.getElementById("questionText");
  qText.classList.remove("in");
  qText.textContent = text;
  if(animate!==false){ requestAnimationFrame(()=>requestAnimationFrame(()=>qText.classList.add("in"))); }
  else { qText.classList.add("in"); }

  document.getElementById("progressLabel").textContent = (state.current+1) + " / " + state.questions.length;
  document.getElementById("progressFill").style.width = Math.round((state.current/state.questions.length)*100) + "%";

  const wrap = document.getElementById("answersWrap");
  wrap.innerHTML = "";
  S.likert.forEach((label,v)=>{
    const btn = document.createElement("button");
    btn.className = "pixel-btn";
    btn.textContent = label;
    btn.addEventListener("click", ()=>answer(q.soulIndex, v));
    wrap.appendChild(btn);
  });
}

function answer(soulIndex, value){
  state.scores[soulIndex] += value;
  state.current++;
  if(state.current >= state.questions.length){ showResult(); }
  else { renderQuestion(true); saveProgress(); }
}

function showResult(){
  hideScreen("screenQuiz");
  const max = Math.max(...state.scores);
  const winners = state.scores.map((v,i)=>v===max?i:-1).filter(i=>i!==-1);
  state.winnerIndex = winners[Math.floor(Math.random()*winners.length)];
  state.screen = "result";
  renderResult();
  showScreen("screenResult");
  saveProgress();
}

function renderResult(){
  const S = LANGS[state.lang];
  const setOpt = getSoulSets(state.lang).find(s=>s.key===state.soulSetKey);
  const winner = setOpt.data[state.winnerIndex];
  const color = soulColor(winner);

  renderHeart(document.getElementById("resultHeart"), color, 18);
  const nameEl = document.getElementById("resultName");
  nameEl.textContent = winner.name.toUpperCase();
  nameEl.style.color = color;
  document.getElementById("resultCaption").textContent = S.resultCaption(setOpt.label.toLowerCase());
}

/* init */
const saved = loadProgress();
if(saved && (saved.screen === "quiz" || saved.screen === "result") &&
   ((saved.screen === "quiz" && saved.questions && saved.questions.length) ||
    (saved.screen === "result" && saved.winnerIndex !== null))){
  applyLanguage(saved.lang && LANGS[saved.lang] ? saved.lang : state.lang);
  showScreen("screenResume");
} else {
  applyLanguage(state.lang);
  showScreen("screenSetup");
}
</script>
