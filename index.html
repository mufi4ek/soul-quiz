<style>
  :root{
    --bg:#0b0b14;
    --panel-a:#1c1c2c;
    --panel-b:#121220;
    --ink:#e9e5f2;
    --dim:#8d8da6;
    --border-soft:#c3bcdd;
    --gold:#f0c24b;
    --mint:#7fe0c4;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Press Start 2P', monospace;
    min-height:100vh;
    overflow-x:hidden;
  }
  body{
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:20px 14px 60px;
    position:relative;
  }

  body::before{
    content:"";
    position:fixed; inset:0;
    background-image:
      radial-gradient(2px 2px at 40px 60px, #d9d3ff2b 50%, transparent 51%),
      radial-gradient(2px 2px at 180px 240px, #d9d3ff1e 50%, transparent 51%),
      radial-gradient(1px 1px at 300px 120px, #d9d3ff2b 50%, transparent 51%),
      radial-gradient(2px 2px at 400px 400px, #d9d3ff1e 50%, transparent 51%),
      radial-gradient(1px 1px at 520px 80px, #d9d3ff26 50%, transparent 51%),
      radial-gradient(2px 2px at 640px 300px, #d9d3ff1e 50%, transparent 51%);
    background-repeat:repeat;
    background-size:680px 480px;
    pointer-events:none;
    z-index:0;
    opacity:.7;
  }
  body::after{
    content:"";
    position:fixed; inset:0;
    background:radial-gradient(circle at 50% 15%, rgba(120,90,255,0.09), transparent 55%),
               radial-gradient(circle at 50% 100%, rgba(0,0,0,0.55), transparent 60%);
    pointer-events:none;
    z-index:0;
  }

  .float-px{
    position:fixed;
    width:6px;height:6px;
    opacity:.3;
    z-index:0;
    animation:floaty 7s ease-in-out infinite;
    will-change:transform;
  }
  .float-px:nth-child(1){left:8%;top:20%;background:var(--gold);animation-duration:7s;}
  .float-px:nth-child(2){left:85%;top:15%;background:#8fd6f5;animation-duration:8.5s;animation-delay:-2s;}
  .float-px:nth-child(3){left:15%;top:75%;background:#f58f8f;animation-duration:6.5s;animation-delay:-4s;}
  .float-px:nth-child(4){left:90%;top:70%;background:var(--mint);animation-duration:9s;animation-delay:-1s;}
  .float-px:nth-child(5){left:50%;top:8%;background:#c9a3ff;animation-duration:7.5s;animation-delay:-3s;}
  @keyframes floaty{0%,100%{transform:translateY(0);}50%{transform:translateY(-16px);}}
  @media (prefers-reduced-motion: reduce){.float-px{animation:none;}}

  .wrap{
    position:relative;
    z-index:1;
    width:100%;
    max-width:520px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:18px;
  }

  .lang-row{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:6px;
  }
  .lang-btn{
    font-family:'Press Start 2P', monospace;
    font-size:9px;
    background:#181826;
    color:var(--dim);
    border:2px solid #33334a;
    padding:6px 8px;
    cursor:pointer;
    transition:transform .1s ease, border-color .1s ease, color .1s ease;
  }
  .lang-btn:hover{transform:translateY(-2px);border-color:var(--border-soft);color:var(--ink);}
  .lang-btn.active{
    border-color:var(--gold);
    color:var(--gold);
    background:#242438;
  }

  h1{
    font-size:16px;
    line-height:1.8;
    text-align:center;
    letter-spacing:1px;
    text-shadow:3px 3px 0 #000, 0 0 14px rgba(240,194,75,.18);
    margin:6px 0 0;
    color:var(--ink);
  }
  .subtitle{
    font-size:8px;
    color:var(--dim);
    text-align:center;
    line-height:1.9;
  }

  /* frame wraps the panel and holds the generated pixel-dust border */
  .pixel-frame{
    position:relative;
    width:100%;
  }
  .dust-layer{
    position:absolute;
    inset:0;
    pointer-events:none;
    z-index:2;
  }
  .dust{
    position:absolute;
  }

  .pixel-panel{
    position:relative;
    z-index:1;
    background:linear-gradient(180deg,var(--panel-a),var(--panel-b));
    border:3px solid var(--border-soft);
    box-shadow:0 0 0 3px #000, 5px 5px 0 0 #000, 0 20px 40px -20px rgba(0,0,0,.85);
    padding:22px 18px;
    width:100%;
    opacity:0;
    transform:translateY(10px);
  }
  .pixel-panel.in{
    transition:opacity .35s ease, transform .35s ease;
    opacity:1;
    transform:translateY(0);
  }

  .group-title{
    font-size:9px;
    color:var(--dim);
    margin-bottom:12px;
    letter-spacing:1px;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .group-title::before{
    content:"";
    width:6px;height:6px;
    background:var(--gold);
    display:inline-block;
    flex:none;
  }

  .option-row{
    display:flex;
    flex-direction:column;
    gap:8px;
    margin-bottom:22px;
  }
  .option-row:last-of-type{margin-bottom:0;}

  .pixel-btn{
    font-family:'Press Start 2P', monospace;
    background:#1c1c28;
    color:var(--ink);
    border:2px solid var(--border-soft);
    box-shadow:4px 4px 0 0 #000;
    padding:12px 10px;
    font-size:9px;
    line-height:1.6;
    text-align:left;
    cursor:pointer;
    width:100%;
    transition:transform .12s ease, box-shadow .12s ease, background .12s ease, border-color .12s ease;
  }
  .pixel-btn:hover{
    background:#26263a;
    transform:translate(-2px,-2px);
    box-shadow:6px 6px 0 0 #000;
  }
  .pixel-btn:active{
    transform:translate(3px,3px);
    box-shadow:1px 1px 0 0 #000;
  }
  .pixel-btn.selected{
    background:#39395a;
    border-color:var(--gold);
    box-shadow:4px 4px 0 0 var(--gold);
  }
  .pixel-btn small{
    display:block;
    color:var(--dim);
    font-size:7px;
    margin-top:6px;
    line-height:1.6;
  }

  .start-btn{
    margin-top:6px;
    background:#26264a;
    border-color:var(--gold);
    color:var(--gold);
    text-align:center;
    font-size:11px;
    padding:16px 10px;
  }
  .start-btn:hover:not(:disabled){background:#33335f;}
  .start-btn:disabled{opacity:.35;cursor:not-allowed;transform:none !important;}

  .progress-wrap{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:8px;
    color:var(--dim);
  }
  .progress-bar{
    flex:1;
    height:14px;
    background:#000;
    border:2px solid var(--border-soft);
    position:relative;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background:repeating-linear-gradient(90deg,var(--gold) 0 6px,#cf9f2e 6px 12px);
    transition:width .3s ease;
  }

  .question-text{
    font-size:11px;
    line-height:2;
    margin-bottom:20px;
    min-height:66px;
    opacity:0;
    transform:translateY(6px);
  }
  .question-text.in{
    transition:opacity .25s ease, transform .25s ease;
    opacity:1;
    transform:translateY(0);
  }

  .answers{display:flex;flex-direction:column;gap:8px;}

  .heart-grid{
    display:grid;
    grid-template-columns:repeat(7, var(--px, 16px));
    grid-template-rows:repeat(6, var(--px, 16px));
    gap:0;
    margin:10px auto 6px;
    animation:heartbeat 1.4s ease-in-out infinite;
    will-change:transform;
  }
  @keyframes heartbeat{0%,100%{transform:scale(1);}30%{transform:scale(1.12);}45%{transform:scale(0.98);}60%{transform:scale(1.08);}}
  @media (prefers-reduced-motion: reduce){.heart-grid{animation:none;}}
  .heart-cell{width:var(--px,16px);height:var(--px,16px);}
  .heart-glow{filter: drop-shadow(0 0 8px var(--glow, #fff));}

  .result-name{
    font-size:16px;
    text-align:center;
    margin:10px 0 4px;
    letter-spacing:1px;
    text-shadow:2px 2px 0 #000;
  }
  .result-caption{
    font-size:8px;
    color:var(--dim);
    text-align:center;
    line-height:2;
    margin-bottom:18px;
  }

  footer{
    margin-top:26px;
    font-size:7px;
    color:#4a4a5c;
    text-align:center;
    line-height:2;
    z-index:1;
    position:relative;
  }

  .watermark{
    position:fixed;
    bottom:6px;
    right:8px;
    font-size:7px;
    color:var(--dim);
    opacity:.18;
    pointer-events:none;
    z-index:3;
    letter-spacing:1px;
    user-select:none;
  }

  .hidden{display:none !important;}

  @media (max-width:380px){
    h1{font-size:12px;}
    .question-text{font-size:10px;}
    .heart-grid{--px:12px;}
  }
</style>
</head>

    uk:["Стійкість","Самовідданість","Хоробрість","Сміливість","Справедливість","Безкорисливість","Доброта","Співчуття","Терпіння","Спокій","Порядність","Мораль","Наполегливість","Мотивація","Самостійність","Старанність","Впевненість","Рішучість","Любов"],
    ru:["Стойкость","Самоотверженность","Храбрость","Смелость","Справедливость","Бескорыстие","Доброта","Сочувствие","Терпение","Спокойствие","Порядочность","Мораль","Настойчивость","Мотивация","Самостоятельность","Старательность","Уверенность","Решительность","Любовь"],
    en:["Resilience","Selflessness","Bravery","Courage","Justice","Generosity","Kindness","Compassion","Patience","Calm","Integrity","Morality","Persistence","Motivation","Independence","Diligence","Confidence","Determination","Love"],
    de:["Standhaftigkeit","Aufopferung","Tapferkeit","Mut","Gerechtigkeit","Selbstlosigkeit","Freundlichkeit","Mitgefühl","Geduld","Gelassenheit","Anständigkeit","Moral","Beharrlichkeit","Motivation","Selbstständigkeit","Fleiß","Zuversicht","Entschlossenheit","Liebe"],
    be:["Стойкасць","Самаахвярнасць","Смеласць","Адвага","Справядлівасць","Бескарыслівасць","Дабрыня","Спагада","Цярпенне","Спакой","Парадачнасць","Мараль","Настойлівасць","Матывацыя","Самастойнасць","Стараннасць","Упэўненасць","Рашучасць","Каханне"],
    pl:["Wytrwałość","Poświęcenie","Odwaga","Śmiałość","Sprawiedliwość","Bezinteresowność","Dobroć","Współczucie","Cierpliwość","Spokój","Uczciwość","Moralność","Konsekwencja","Motywacja","Samodzielność","Pracowitość","Pewność siebie","Determinacja","Miłość"],
    es:["Firmeza","Entrega","Valentía","Valor","Justicia","Generosidad","Bondad","Compasión","Paciencia","Calma","Integridad","Moral","Constancia","Motivación","Independencia","Dedicación","Confianza","Determinación","Amor"],
  }
};

const COLORS = {
  classic:[0,30,52,120,185,230,280].map(hue=>({hue})),
  extended:(()=>{
    const raw=[];
    for(let i=0;i<18;i++) raw.push({hue:Math.round(i*(300/17))});
    raw.push({hue:0,isWhite:true});
    return raw;
  })()
};

function soulColor(c){ return c.isWhite ? "#f4f1ff" : `hsl(${c.hue}, 72%, 58%)`; }

const HEART_MAP = ["0110110","1111111","1111111","0111110","0011100","0001000"];

/* ============ state ============ */
let state = {
  lang:"uk",
  setKey:null,      // "classic" | "extended"
  accKey:null,      // "fast" | "medium" | "max"
  perSoulByAcc:{fast:1, medium:2, max:3},
  questions:[],     // {soulIndex, templateIdx}
  scores:[],
  current:0,
  winnerIndex:null,
};

/* ============ dust border generator ============ */
function scatterDust(frame, colors){
  const layer = document.createElement("div");
  layer.className = "dust-layer";
  const n = 12;
  const add=(left,top,color,size)=>{
    const d=document.createElement("div");
    d.className="dust";
    d.style.left=left; d.style.top=top;
    d.style.width=size+"px"; d.style.height=size+"px";
    d.style.background=color;
    d.style.opacity=(0.45+Math.random()*0.5).toFixed(2);
    layer.appendChild(d);
  };
  const pick=()=>colors[Math.floor(Math.random()*colors.length)];
  for(let i=0;i<n;i++){
    const pct=(i/(n-1))*100, j=Math.random()*6-1, s=3+Math.round(Math.random()*3);
    add(`calc(${pct}% - ${s/2}px)`, `${-2-j}px`, pick(), s);
  }
  for(let i=0;i<n;i++){
    const pct=(i/(n-1))*100, j=Math.random()*6-1, s=3+Math.round(Math.random()*3);
    add(`calc(${pct}% - ${s/2}px)`, `calc(100% - ${s/2}px + ${j}px)`, pick(), s);
  }
  for(let i=0;i<n;i++){
    const pct=(i/(n-1))*100, j=Math.random()*6-1, s=3+Math.round(Math.random()*3);
    add(`${-2-j}px`, `calc(${pct}% - ${s/2}px)`, pick(), s);
  }
  for(let i=0;i<n;i++){
    const pct=(i/(n-1))*100, j=Math.random()*6-1, s=3+Math.round(Math.random()*3);
    add(`calc(100% - ${s/2}px + ${j}px)`, `calc(${pct}% - ${s/2}px)`, pick(), s);
  }
  [[0,0],[100,0],[0,100],[100,100]].forEach(([cx,cy])=>{
    for(let i=0;i<6;i++){
      const s=3+Math.round(Math.random()*4), ox=Math.random()*14-7, oy=Math.random()*14-7;
      add(`calc(${cx}% - ${s/2}px + ${ox}px)`, `calc(${cy}% - ${s/2}px + ${oy}px)`, pick(), s);
    }
  });
  frame.appendChild(layer);
}
const DUST_PALETTE = ["#f0c24b","#c3bcdd","#7fe0c4","#8fd6f5","#f58f8f","#c9a3ff"];
scatterDust(document.getElementById("frameSetup"), DUST_PALETTE);
scatterDust(document.getElementById("frameQuiz"), DUST_PALETTE);
scatterDust(document.getElementById("frameResult"), DUST_PALETTE);

/* ============ heart render ============ */
function renderHeart(container, color, px){
  container.innerHTML = "";
  const grid = document.createElement("div");
  grid.className = "heart-grid heart-glow";
  grid.style.setProperty("--px", (px||16)+"px");
  grid.style.setProperty("--glow", color);
  HEART_MAP.forEach(row=>{
    [...row].forEach(bit=>{
      const cell = document.createElement("div");
      cell.className = "heart-cell";
      cell.style.background = bit==="1" ? color : "transparent";
      grid.appendChild(cell);
    });
  });
  container.appendChild(grid);
}

/* ============ screen transitions ============ */
function showScreen(frameId, panelId){
  document.getElementById(frameId).classList.remove("hidden");
  const panel = document.getElementById(panelId);
  panel.classList.remove("in");
  requestAnimationFrame(()=>requestAnimationFrame(()=>panel.classList.add("in")));
}
function hideScreen(frameId, panelId){
  document.getElementById(frameId).classList.add("hidden");
  document.getElementById(panelId).classList.remove("in");
}

/* ============ language application ============ */
const langRow = document.getElementById("langRow");
LANGS.forEach(l=>{
  const btn = document.createElement("button");
  btn.className = "lang-btn" + (l.code===state.lang ? " active" : "");
  btn.textContent = l.flag + " " + l.code.toUpperCase();
  btn.addEventListener("click", ()=>setLang(l.code));
  btn.dataset.code = l.code;
  langRow.appendChild(btn);
});

function setLang(code){
  state.lang = code;
  [...langRow.children].forEach(b=>b.classList.toggle("active", b.dataset.code===code));
  applyStaticText();
  renderSetupOptions();
  checkReady();
  if(!document.getElementById("frameQuiz").classList.contains("hidden") && state.questions.length){
    renderQuestion(false);
  }
  if(!document.getElementById("frameResult").classList.contains("hidden") && state.winnerIndex!==null){
    renderResultText();
  }
}

function applyStaticText(){
  const t = UI[state.lang];
  document.getElementById("titleText").textContent = t.title;
  document.getElementById("subtitleText").textContent = t.subtitle;
  document.getElementById("step1Text").textContent = t.step1;
  document.getElementById("step2Text").textContent = t.step2;
  document.getElementById("startBtn").textContent = t.startBtn;
  document.getElementById("restartBtn").textContent = t.restartBtn;
  document.getElementById("resultTitleText").textContent = t.resultTitle;
  document.getElementById("footerText").innerHTML = t.footer;
}

/* ============ setup screen options ============ */
const setChoicesEl = document.getElementById("setChoices");
const accChoicesEl = document.getElementById("accChoices");
const startBtn = document.getElementById("startBtn");
const SET_KEYS = ["classic","extended"];
const ACC_KEYS = ["fast","medium","max"];

function renderSetupOptions(){
  const t = UI[state.lang];
  setChoicesEl.innerHTML = "";
  SET_KEYS.forEach((key,i)=>{
    const btn = document.createElement("button");
    btn.className = "pixel-btn" + (state.setKey===key ? " selected" : "");
    btn.innerHTML = t.setLabels[i] + "<small>"+t.setHints[i]+"</small>";
    btn.addEventListener("click", ()=>{
      state.setKey = key;
      [...setChoicesEl.children].forEach(c=>c.classList.remove("selected"));
      btn.classList.add("selected");
      checkReady();
    });
    setChoicesEl.appendChild(btn);
  });
  accChoicesEl.innerHTML = "";
  ACC_KEYS.forEach((key,i)=>{
    const btn = document.createElement("button");
    btn.className = "pixel-btn" + (state.accKey===key ? " selected" : "");
    btn.innerHTML = t.accLabels[i] + "<small>"+t.accHints[i]+"</small>";
    btn.addEventListener("click", ()=>{
      state.accKey = key;
      [...accChoicesEl.children].forEach(c=>c.classList.remove("selected"));
      btn.classList.add("selected");
      checkReady();
    });
    accChoicesEl.appendChild(btn);
  });
}
function checkReady(){ startBtn.disabled = !(state.setKey && state.accKey); }

startBtn.addEventListener("click", startQuiz);
document.getElementById("restartBtn").addEventListener("click", ()=>{
  hideScreen("frameResult","screenResult");
  showScreen("frameSetup","screenSetup");
});

/* ============ quiz logic ============ */
function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
  return arr;
}

function startQuiz(){
  const souls = COLORS[state.setKey];
  const perSoul = state.perSoulByAcc[state.accKey];
  let qs = [];
  souls.forEach((_,idx)=>{
    for(let k=0;k<perSoul;k++){
      qs.push({ soulIndex: idx, templateIdx: k % 4 });
    }
  });
  qs = shuffle(qs);

  state.questions = qs;
  state.scores = souls.map(()=>0);
  state.current = 0;
  state.winnerIndex = null;

  hideScreen("frameSetup","screenSetup");
  showScreen("frameQuiz","screenQuiz");
  renderQuestion(true);
}

function renderQuestion(animate){
  const q = state.questions[state.current];
  const t = UI[state.lang];
  const names = NAMES[state.setKey][state.lang];
  const template = TEMPLATES[state.lang][q.templateIdx];
  const text = template.replace("{t}", names[q.soulIndex].toLowerCase());

  const qText = document.getElementById("questionText");
  qText.classList.remove("in");
  qText.textContent = text;
  if(animate){
    requestAnimationFrame(()=>requestAnimationFrame(()=>qText.classList.add("in")));
  } else {
    qText.classList.add("in");
  }

  document.getElementById("progressLabel").textContent = (state.current+1) + " / " + state.questions.length;
  document.getElementById("progressFill").style.width = Math.round((state.current/state.questions.length)*100) + "%";

  const wrap = document.getElementById("answersWrap");
  wrap.innerHTML = "";
  t.likert.forEach((label,v)=>{
    const btn = document.createElement("button");
    btn.className = "pixel-btn";
    btn.textContent = label;
    btn.addEventListener("click", ()=>answer(q.soulIndex, v));
    wrap.appendChild(btn);
  });
}

function answer(soulIndex, value){
  state.scores[soulIndex] += value;
  state.current++;
  if(state.current >= state.questions.length){
    showResult();
  } else {
    renderQuestion(true);
  }
}

function showResult(){
  hideScreen("frameQuiz","screenQuiz");
  const max = Math.max(...state.scores);
  const winners = state.scores.map((s,i)=>s===max?i:-1).filter(i=>i>=0);
  state.winnerIndex = winners[Math.floor(Math.random()*winners.length)];
  renderResultText();
  showScreen("frameResult","screenResult");
}

function renderResultText(){
  const t = UI[state.lang];
  const names = NAMES[state.setKey][state.lang];
  const setLabel = UI[state.lang].setLabels[SET_KEYS.indexOf(state.setKey)];
  const color = soulColor(COLORS[state.setKey][state.winnerIndex]);

  renderHeart(document.getElementById("resultHeart"), color, 18);
  document.getElementById("resultName").textContent = names[state.winnerIndex].toUpperCase();
  document.getElementById("resultName").style.color = color;
  document.getElementById("resultCaption").textContent = t.resultCaption.replace("{set}", setLabel.toLowerCase());
}

/* ============ init ============ */
applyStaticText();
renderSetupOptions();
showScreen("frameSetup","screenSetup");
console.log("made by mufi (mufi4ek)");
</script>
